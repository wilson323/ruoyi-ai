# ---- map：WebSocket 升级头条件化（置于 http 上下文；include 本文件于 http 内时生效）----
# 若以 conf.d 方式 include 且主 nginx.conf 已有同名 map，删去本段避免重复定义
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
