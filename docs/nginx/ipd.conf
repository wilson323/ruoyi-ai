# =============================================================================
# IPD 产品经理管理系统 — 宿主层 nginx 反向代理配置
# =============================================================================
# 部署时需 owner 确认域名/证书：
#   1. server_name 当前为占位（ipd.example.com），部署前替换为实际域名或 _
#   2. HTTPS/TLS：QA-06 显式未验项（本地隔离环境无生产 HTTPS 要求成文原文），
#      443 server 块以注释模板提供，证书签发/路径由 owner 拍板后启用
#   3. 证书文件路径（ssl_certificate / ssl_certificate_key）同样待 owner 定
#
# 事实依据（2026-09-19 现查）：
#   - 后端：RuoYiAIApplication，监听 16039（docker-compose.yml backend 服务）
#   - 前端：ruoyi-ipd-web/apps/web-antd nginx 容器，监听 5666（compose 映射 80:5666），
#     前端容器自身已完成 /api/v1 保留前缀直转 + /api/ 去前缀转发（契约见
#     apps/web-antd/nginx.conf，"不得 rewrite /api/v1"）
#   - SSE 端点（SSE 契约门禁 scripts/check_sse_contract.sh）：
#       * /api/v1/resource/sse          （IpdSseController）
#       * /api/v1/ai-copilot/chat/stream（AiCopilotController）
#     SSE 响应必须禁用缓冲（proxy_buffering off），否则事件流被攒包延迟/卡死
#
# 本文件定位：宿主机/边缘层统一入口（TLS 终结 + 静态/反代分流）。
# 用法（二选一）：
#   a) cp docs/nginx/ipd.conf /etc/nginx/conf.d/ipd.conf && nginx -t && nginx -s reload
#      —— 反代到前端容器（需 compose 端口改为 127.0.0.1:5666 避免与 80 冲突）
#   b) 若使用前端容器直连模式（compose 默认 80:5666），本文件仅作边缘层参考模板
#
# 状态码契约：后端认证失败走 401（sa-token），与 SseErrorEmitter error 帧配合，
# 本配置不得改写任何 /api 响应体。
# =============================================================================

# ---- 上游定义 ----
# 后端 Java 服务（docker-compose backend / 宿主 java -jar 两种部署形态同端口）
upstream ipd_backend {
    server 127.0.0.1:16039;
    keepalive 32;
}

# 前端静态资源服务（docker-compose frontend 容器，nginx 托管 dist 产物）
# 部署形态 a 使用；形态 b（宿主 nginx 直接托管静态文件）改用下方 root 方案
upstream ipd_frontend {
    server 127.0.0.1:5666;
    keepalive 16;
}

server {
    listen 80;
    # TODO(owner): 部署前确认域名。未定域名期间可用 default_server 兜底：
    # server_name ipd.example.com;
    server_name _;

    # 前端请求体上限（附件上传场景；后端 spring servlet multipart 上限对齐）
    client_max_body_size 100m;

    # ---- SSE 专用 location（必须置于 /api/v1/ 之前，精确前缀优先命中）----
    # 覆盖两个 SSE 端点：/api/v1/resource/sse 与 /api/v1/ai-copilot/chat/stream
    location ~ ^/api/v1/(resource/sse|ai-copilot/chat/stream)$ {
        proxy_pass http://ipd_backend;
        proxy_http_version 1.1;

        # SSE 核心：禁用一切缓冲，事件帧即产即推
        proxy_buffering off;
        proxy_cache off;
        # 允许后端 X-Accel-Buffering: no 头逐连接关闭缓冲（双保险）
        proxy_pass_header X-Accel-Buffering;

        # SSE 长连接：读超时放宽（心跳间隔须小于该值）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 清空 Connection 头，保持 chunked 流式（与 WebSocket 的 upgrade 头不同）
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对齐 SSE 契约：认证失败 401 由后端 SseErrorEmitter 推 error 帧，
        # nginx 层不做拦截/改写（proxy_intercept_errors 默认 off，保持）
        proxy_intercept_errors off;
    }

    # ---- IPD 契约：/api/v1 保留前缀直转后端（不得 rewrite，对齐前端 nginx.conf）----
    location /api/v1/ {
        proxy_pass http://ipd_backend;
        proxy_http_version 1.1;

        # WebSocket 升级头（前端容器配置同款惯例；当前 IPD 后端无 WS 端点，保留无害）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # ---- RuoYi 风格 /api/：去 /api 前缀转发（对齐前端 nginx.conf 契约）----
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ipd_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- actuator 健康检查（QA-06 compose healthcheck 同路径）：仅内网探活用 ----
    location = /actuator/health {
        proxy_pass http://ipd_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 前端入口（形态 a：反代前端容器）----
    location / {
        proxy_pass http://ipd_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 前端入口（形态 b：宿主直接托管静态文件，替换上方 location /）----
    #location / {
    #    root /var/www/ipd-web/dist;   # ruoyi-ipd-web/apps/web-antd 构建产物
    #    try_files $uri $uri/ /index.html;   # SPA history 路由兜底
    #    index index.html;
    #}

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

