# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.ruoyi.**.mapper,org.xxx.**.mapper
  mapperPackage: org.ruoyi.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.ruoyi.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: false
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥（PEM 字面量已移除以避免 git 历史长期暴露——SEC-NEW-MED-4 Round 9）。
  # 真值必须通过 ${API_DECRYPT_PRIVATE_KEY} 环境变量注入（见下方 privateKey 行）；
  # 留空时即便 enabled=true 也会因空私钥启动失败（fail-fast 语义）。
  publicKey: ${API_DECRYPT_PUBLIC_KEY:}
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 通过环境变量 API_DECRYPT_PRIVATE_KEY 注入；留空时即便 enabled=true 也会因空私钥启动失败
  privateKey: ${API_DECRYPT_PRIVATE_KEY:}

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：ruoyi-ai管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name:  ageerle
      email: ageerle@163.com
      url: https://gitee.com/ageerle/ruoyi-ai

  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.ruoyi.demo
    - group: 2.通用模块
      packages-to-scan: org.ruoyi.web
    - group: 3.系统模块
      packages-to-scan: org.ruoyi.system
    - group: 4.代码生成模块
      packages-to-scan: org.ruoyi.generator
    - group: 5.工作流模块
      packages-to-scan: org.ruoyi.workflow
    - group: 6.MCP模块
      packages-to-scan: org.ruoyi.mcp

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 链路追踪配置
trace:
  # 是否启用链路追踪，默认 true
  # 关闭后所有埋点代码会直接透传业务逻辑，不写库、不创建上下文，零性能开销
  enabled: true
  payload:
    # 错误信息最大字符长度（格式: "异常类名: 异常消息"），超过部分会被截断丢弃
    max-error-length: 1000

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
# SEC-NEW-MED-1: 父基线显式收窄到 health,info,metrics（避免暴露 env/heapdump/shutdown/threaddump 等敏感端点）
# dev profile 在 application-dev.yml 显式覆盖为通配全部端点（本地调试便利）
# prod profile 必须保持父基线或显式收窄（hook 阻断由用户手动合并）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # R174-P1.5 加 prometheus 端点（Micrometer 抓取）
  endpoint:
    health:
      # SEC-NEW-MED-1: show-details 从 ALWAYS 改 WHEN_AUTHORIZED（未授权用户只看到 UP/DOWN 状态，不暴露 DB/磁盘详情）
      show-details: WHEN_AUTHORIZED
      probes:
        enabled: true  # R174-P1.5 启用 livenessState / readinessState 健康探针
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true
    prometheus:
      access: read_only  # R174-P1.5 只读 metrics（不可改）
    logfile:
      external-file: ./logs/sys-console.log
  metrics:
    tags:
      application: ${spring.application.name}  # R174-P1.5 Prometheus tag
  prometheus:
    metrics:
      export:
        enabled: true  # R174-P1.5 启用 Prometheus exporter

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse


--- # 演示模式配置
demo:
  # R8-P0-2：默认关闭，避免误开启阻断全部 IPD 写操作；dev profile 如需演示模式请在 application-dev.yml 显式覆盖
  # （upstream 曾 env 化 ${DEMO_ENABLED:false}，ProdConfigDeltaGuardTest 守卫要求字面 false：demo 误开会拦全部写链，不允许 env 注入旁路）
  enabled: false
  # 提示消息
  message: "演示模式，不允许操作"
  # 排除的路径（这些路径不受演示模式限制）
  excludes:
    - /login
    - /logout
    - /register
    - /captcha/**
    - /auth/**
    - /chat/send
    - /system/session/**
    - /system/message/**
    - /system/attach/**
    - /system/fragment/**
    - /system/info/**
    # IPD 独立认证体系（与 security.excludes 对齐）：默认 dev profile 演示模式放行 IPD 写操作
    - /api/v1/**
--- # 向量库配置
vector-store:
  # 向量存储类型 可选(weaviate/milvus/qdrant)
  # 注意：需与 docker-compose 实际部署的向量库保持一致
  #
  # 2026-10-03：全部向量库地址改为环境变量注入。
  # 原为硬编码 127.0.0.1:28080 / localhost:19530 / localhost:6334，而
  # application-prod.yml 里**完全没有 vector-store 段**、docker-compose.yml
  # 也没有任何向量库变量 —— 生产容器内 RAG 会静默连 localhost 并返回空检索结果
  # （CLAUDE.md 已记载该失败模式：RAG 查询静默返回空）。本地默认值保持不变，
  # 所以开发机行为零变化；生产只需注入 VECTOR_STORE_* 即可。
  type: ${VECTOR_STORE_TYPE:weaviate}
  # Weaviate配置
  weaviate:
    protocol: ${VECTOR_STORE_WEAVIATE_PROTOCOL:http}
    host: ${VECTOR_STORE_WEAVIATE_HOST:127.0.0.1:28080}
    classname: ${VECTOR_STORE_WEAVIATE_CLASSNAME:LocalKnowledge}
  # Milvus配置
  milvus:
    url: ${VECTOR_STORE_MILVUS_URL:http://localhost:19530}
    collectionname: ${VECTOR_STORE_MILVUS_COLLECTION:LocalKnowledge}
  # Qdrant配置
  qdrant:
    host: ${VECTOR_STORE_QDRANT_HOST:localhost}
    port: ${VECTOR_STORE_QDRANT_PORT:6334}
    collectionname: LocalKnowledge
    api-key:
    use-tls: false

# 流程编排扩展节点
workflow:
  web-search:
    zhipu:
      # 推荐通过环境变量注入；为空时回退到模型管理中的 zhipu 厂商密钥
      api-key: ${ZAI_API_KEY:}
      base-url: ${ZHIPU_WEB_SEARCH_BASE_URL:https://open.bigmodel.cn/api/paas/v4/}
      connect-timeout: ${ZHIPU_WEB_SEARCH_CONNECT_TIMEOUT:10}
      read-timeout: ${ZHIPU_WEB_SEARCH_READ_TIMEOUT:30}

# 短剧成片合成
short-drama:
  composition:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    fps: ${SHORT_DRAMA_COMPOSITION_FPS:30}
    audio-sample-rate: ${SHORT_DRAMA_COMPOSITION_AUDIO_SAMPLE_RATE:48000}
    video-codec: ${SHORT_DRAMA_COMPOSITION_VIDEO_CODEC:libx264}
    audio-codec: ${SHORT_DRAMA_COMPOSITION_AUDIO_CODEC:aac}
    preset: ${SHORT_DRAMA_COMPOSITION_PRESET:medium}
    crf: ${SHORT_DRAMA_COMPOSITION_CRF:20}
    audio-bitrate: ${SHORT_DRAMA_COMPOSITION_AUDIO_BITRATE:192k}
    max-clips: ${SHORT_DRAMA_COMPOSITION_MAX_CLIPS:100}
    max-transition-seconds: ${SHORT_DRAMA_COMPOSITION_MAX_TRANSITION_SECONDS:2.0}
    minimum-output-bytes: ${SHORT_DRAMA_COMPOSITION_MINIMUM_OUTPUT_BYTES:1024}
    max-process-output-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_PROCESS_OUTPUT_BYTES:1048576}
    max-source-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_SOURCE_BYTES:536870912}
    max-total-source-bytes: ${SHORT_DRAMA_COMPOSITION_MAX_TOTAL_SOURCE_BYTES:2147483648}
    probe-timeout: ${SHORT_DRAMA_COMPOSITION_PROBE_TIMEOUT:30s}
    process-timeout: ${SHORT_DRAMA_COMPOSITION_PROCESS_TIMEOUT:30m}
    job-stale-after: ${SHORT_DRAMA_COMPOSITION_JOB_STALE_AFTER:45m}
    watermark-font-file: ${SHORT_DRAMA_COMPOSITION_WATERMARK_FONT_FILE:}
    worker-core-size: ${SHORT_DRAMA_COMPOSITION_WORKER_CORE_SIZE:1}
    worker-max-size: ${SHORT_DRAMA_COMPOSITION_WORKER_MAX_SIZE:2}
    worker-queue-capacity: ${SHORT_DRAMA_COMPOSITION_WORKER_QUEUE_CAPACITY:8}
    storage-mode: ${SHORT_DRAMA_COMPOSITION_STORAGE_MODE:local}
    local-output-directory: ${SHORT_DRAMA_COMPOSITION_LOCAL_OUTPUT_DIRECTORY:logs/short-drama-compositions}
    download:
      connect-timeout: ${SHORT_DRAMA_DOWNLOAD_CONNECT_TIMEOUT:30s}
      call-timeout: ${SHORT_DRAMA_DOWNLOAD_CALL_TIMEOUT:10m}
      max-redirects: ${SHORT_DRAMA_DOWNLOAD_MAX_REDIRECTS:5}
      # 生产环境建议配置为视频供应商或 OSS/CDN 域名，多个值用逗号分隔。
      allowed-hosts: ${SHORT_DRAMA_DOWNLOAD_ALLOWED_HOSTS:}
      fake-ip-allowed-hosts: ${SHORT_DRAMA_DOWNLOAD_FAKE_IP_ALLOWED_HOSTS:atlas-media.oss-us-west-1.aliyuncs.com}
