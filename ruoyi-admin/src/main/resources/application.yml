# 开发环境配置
server:
  # 服务器的HTTP端口，默认为6039
  port: 6039
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  # SEC-LOW-4：父基线显式空字符串（同源默认），不允许 '*' 通配。
  # websocket.enabled=false 时此配置不生效；切到 true 时按同源匹配，避免任意源跨域访问。
  # dev profile 在 application-dev.yml 显式覆盖 '*'（本地双端口调试便利）；
  # prod 走父基线或显式收敛到具体 origin（hook 阻断由用户手动合并）。
  allowedOrigins: ''

--- # 跨域（CORS）
cors:
  # 允许跨域的来源清单，逗号分隔；留空 = 不放开任何跨域来源（仅同源可访问）。
  # 生产是同源部署（前端由 nginx 反代 /api，见根 docker-compose.yml 的 frontend 服务），
  # 不需要放开；确需跨域时用环境变量显式列举，例如：
  #   CORS_ALLOWED_ORIGINS=https://ipd.example.com,https://ipd-admin.example.com
  # 不允许写 '*'：通配 + 允许凭证会让任意第三方站点在受害者浏览器里读取本系统全部接口响应。
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 是否允许跨域请求携带浏览器凭证（Cookie / 客户端证书）；仅在 allowed-origins 非空时有意义。
  # 鉴权走 Authorization: Bearer 请求头，不读 Cookie（common-satoken.yml: is-read-cookie=false），故默认关闭。
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

--- # 小程序对话 WebSocket 兜底默认模型（前端未传 model 且无智能体绑定时使用）
chat:
  default-model: deepseek-v4-flash

captcha:
  # 是否启用验证码校验
  enable: false
  # 验证码类型 math 数组计算 char 字符验证
  type: MATH
  # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
  category: CIRCLE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.ruoyi: ${LOGGING_LEVEL_ORG_RUOYI:info}
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
    # MCP traffic/stdout may contain tool arguments, results or credentials.
    MCP: "OFF"
    # 单轨：MCP 走 AgentScope + io.modelcontextprotocol SDK
    io.agentscope.core.tool.mcp: "OFF"
    io.modelcontextprotocol: "OFF"
  # 使用 logback-spring.xml 以支持 <springProfile name="dev|prod"> 切换 root level
  # （详见 logback-spring.xml 头部注释；logback-plus.xml 已废弃仅保留向后兼容）
  config: classpath:logback-spring.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: ruoyi-ai
  # ⚠️ 禁用 Spring Boot 的 Neo4j 自动配置
  # 默认情况下，如果类路径上存在 neo4j-java-driver，Spring Boot 会尝试自动配置
  # 这会导致应用在启动时尝试连接到 Neo4j，即使我们没有需要它
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 20MB
      # 设置总上传的文件大小
      max-request-size: 21MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
  # W20-B：邮件通道 SMTP（W15-C Notification 中间件化 EMAIL 真实化）
  mail:
    host: ${MAIL_HOST:smtp.localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # 数据源连接池默认参数（QA-05-P1）
  # 本项目数据源由 baomidou dynamic-datasource 创建，池参数生效路径是
  # spring.datasource.dynamic.hikari.*（Spring Boot 原生 spring.datasource.hikari.* 不生效）。
  # 此处为未显式配池的 profile（如 ipd-local）提供安全基线：
  # 缺省时 HikariCP 默认 maximumPoolSize=10 + connectionTimeout=30s，并发>10 即排队雪崩。
  # application-dev.yml / application-prod.yml 以同名键覆盖
  # （dev 已升 80；prod 已 apply application-prod-batch4-bcrypt-hikari.patch 上浮至 80，超原 spec 60 — 同步自 SEC-HIGH-1 R9-BC-COST BCrypt cost=10 持连接时间×10 的压测；详见 Wave3-实施规格包修订 + SEC-AUD rebuttal）。
  datasource:
    dynamic:
      # 性能分析插件（有性能损耗 不建议生产环境使用）
      # PERF-P1-3 + SEC-NEW-MED-2: 父基线显式 false，所有 profile 默认走安全基线
      # dev profile 需在 application-dev.yml 显式覆盖为 true（本地 SQL 调试用）
      # prod profile 必须在 application-prod.yml 显式保持 false 或留空走本基线（hook 阻断由用户手动合并）
      p6spy: false
      hikari:
        # 最大连接池数量
        # QA-05-P1 P1-1（U0）连接预算约束：基座值必须满足「在跑实例数 × maxPoolSize ≤ max_connections」。
        # 实测 max_connections=151，本仓常态 4 实例并存（16039/16044/16045/16050）；
        # 锚点等式 4 × HikariCP 默认 10 = 40 ≡ processlist 中 ipd_app 的 40 个连接（且全为 Sleep 空闲态）
        # → 常驻连接数由池预留决定、与业务负载无关（零负载也占满），故可据此确定性外推。
        # 基座取 20（与 prod 现值一致）：4 × 20 = 80，53% 水位，留 71 个连接给压测/运维实例。
        # 若取 40：4 × 40 = 160 > 151 → ERROR 1040 Too many connections，比池排队雪崩更严重
        # （新实例根本起不来、运行中实例取不到连接，且 ipd_app 非 SUPER 拿不到 MySQL 保留连接）。
        # dev 单实例压测若需更大池，请在 application-dev.yml 显式覆盖
        # （dev 已按 SEC-HIGH-1 (R9-BC-COST) 升至 80，与 BCrypt cost=10 同步发车；多实例并存时注意 4×80>151 的 1040 预算）。
        maxPoolSize: 20
        # 最小空闲连接数量
        minIdle: 10
        # 配置获取连接等待超时的时间：5s 快速失败，避免高并发下 30s 排队雪崩
        connectionTimeout: 5000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  # 注意：application.yml 不再含任何默认密钥；所有 profile 必须通过 SA_TOKEN_JWT_SECRET_KEY 环境变量注入
  # application-dev.yml 提供 dev profile 默认值（仅供本地启动）
  # application-prod.yml 加 jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:}（无默认）覆盖（待 sensitive-field-guard hook 解除后由用户/CI 手动合并）
  # R8 后台安全审查 credentials-exposure：原 commit a8a70ad9 把密钥明文写入 application.yml 历史已可见，需视为泄露并轮换
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:}

# IPD 模块配置（SEC-HIGH-2：INITIAL_PWD 挪 env 注入）
ipd:
  # IPD 独立 WebSocket 端点（IpdWebSocketConfig；owner 裁决 2026-10-03：保留 IPD 独立键，
  # 不与平台 websocket.enabled 合并——两套 Sa-Token 鉴权域不同，合并会同时激活平台端点并冲突）。
  # 注意与 ipd.notification.websocket（通知投递渠道参数）是两码事：本段控制端点是否注册。
  # 此前任何 yml 都没有 enabled 键 → @ConditionalOnProperty 永不成立 → 端点从不注册，
  # 而文档教人开的却是平台键 websocket.enabled（开了也没用，还与 IPD 冲突）。
  websocket:
    # 总开关：默认 false（关闭时 IpdWebSocketConfig 整个不装配，实时推送退化为站内信
    # ——ipd.notification.websocket.offline-fallback-to-inbox 兜底）。开启用环境变量
    # IPD_WEBSOCKET_ENABLED=true，不要用平台的 websocket.enabled。
    enabled: ${IPD_WEBSOCKET_ENABLED:false}
    # 端点路径（与前端 vite 代理「/api/v1 不剥离」规则配套；平台是 /resource/websocket，两者隔离）
    path: /api/v1/resource/websocket
    # 跨域来源：prod 必须收敛到具体 origin（同 SEC-LOW-4 口径，不允许裸 *）；dev 可覆盖 '*'
    allowed-origins: ${IPD_WEBSOCKET_ALLOWED_ORIGINS:}
  security:
    # Mock 初始化器（IpdMockDataInitializer）种子的初始密码来源
    # 父基线无默认：prod profile 必须在 application-prod.yml 或环境变量 IPD_INITIAL_PWD 显式注入，缺失则 fail-fast
    # dev profile 在 application-dev.yml 显式覆盖默认值方便本地启动
    initial-password: ${IPD_INITIAL_PWD:}
  notification:
    # W20-B：Notification 中间件化真实通道配置
    email:
      # 发件人；空则用 spring.mail.username
      from: ${IPD_NOTIFY_EMAIL_FROM:noreply@ipd.local}
      # 收件人域后缀（Person 表无 email 字段，按 receiverId 合成 person-{id}@{domain}）
      receiver-domain: ${IPD_NOTIFY_EMAIL_DOMAIN:ipd.local}
      # 是否启用真实发送；false 时退化为 stub（仅日志），便于本地不接 SMTP
      enabled: ${IPD_NOTIFY_EMAIL_ENABLED:false}
      # 模板字符编码（默认 UTF-8 兼容中文）
      encoding: UTF-8
      # 主题前缀（便于邮件客户端筛选）
      subject-prefix: "[IPD]"
    websocket:
      # 推送目的前缀（与 ruoyi-common-websocket 默认 /topic/ 兼容）
      destination-prefix: /topic/notifications/
      # 用户离线时是否落库（与 InApp 一致）：true=入 INBOX 兜底
      offline-fallback-to-inbox: true
  # R214/U0 安全闸门：企微 Mock 扫码登录端点（POST /api/v1/auth/wecom/qr-login）
  # 该端点匿名可达（IpdWebSecurityConfig 双豁免），Mock 能力默认关闭；仅 dev 显式置 true 联调。
  # 关闭时统一返回 409 + QR_LOGIN_NOT_ENABLED(50019)，不查库、不签发 FULL JWT。
  auth:
    qr-login:
      enabled: ${IPD_AUTH_QR_LOGIN_ENABLED:false}      # 默认关闭（prod 保持关闭；dev 需显式开）
  # HR 真源配置（FA-HR-Sync·2026-09-21 R149-v1；对接 信息集成平台接口文档-EHR.docx ）
  # 真凭据（appId/secretKey/baseUrl）一律走 .codex/ipd-dev/config/application-ipd-local.yml
  # 本仓不落任何字面量（sensitive-field-guard hook 会阻断）。
  hr:
    enabled: ${IPD_HR_ENABLED:false}                  # 默认关闭（prod 必须显式 开）
    app-id: ${IPD_HR_APP_ID:}
    secret-key: ${IPD_HR_SECRET_KEY:}
    base-url: ${IPD_HR_BASE_URL:}
    http:
      connect-timeout-ms: ${IPD_HR_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${IPD_HR_READ_TIMEOUT_MS:30000}
      retry-count: ${IPD_HR_RETRY_COUNT:2}
    # 调度策略（R149-v1 D1.5/D3）；错峰 02:00（与既有 09:00/09:05 不冲突）
    # cron 为空 ⇒ HrSyncJob 不装配（不空跑）
    sync:
      enabled: ${IPD_HR_SYNC_ENABLED:true}
      cron: ${IPD_HR_SYNC_CRON:0 0 2 * * ?}
      timeout-ms: ${IPD_HR_SYNC_TIMEOUT_MS:600000}
      scope: ${IPD_HR_SYNC_SCOPE:ALL}        # ALL=全量 / INCREMENTAL=仅 NEW（R149-v1 仅 ALL 实现）

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    # IPD 独立认证体系（StpLogic "ipd"）——/api/v1/** 鉴权由 IpdPermission 自管，不走基线 sys_user 会话
    - /api/v1/**
    # CopilotKit AG-UI 桥（2026-09-28）：/copilotkit/** 同款 IPD 会话自管（run 端点 Bearer 校验在 AgUiCopilotRun 内做）
    - /copilotkit/**
# 多租户配置
tenant:
