# 静态工程检查；不证明完整实践、数据库或业务验收。
# 非零结果、缺输入、未执行均阻断；不使用可选secret降低门禁。
name: r25-root-cause-lint
on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

jobs:
  lint-r25:
    name: R25 static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_ROOT: ${{ github.workspace }}/related-frontend/apps/web-antd
      DOCS_ROOT: ${{ github.workspace }}/related-spec
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 配置为可读取的明确仓库与不可变commit；私有跨仓由token授权。
      # 未配置时失败，不将缺输入或secret当成skip-success。
      - name: Require cross-repository candidate configuration
        env:
          FRONTEND_REPOSITORY: ${{ vars.IPD_FRONTEND_REPOSITORY }}
          FRONTEND_COMMIT: ${{ vars.IPD_FRONTEND_COMMIT }}
          SPEC_REPOSITORY: ${{ vars.IPD_SPEC_REPOSITORY }}
          SPEC_COMMIT: ${{ vars.IPD_SPEC_COMMIT }}
        run: |
          set -euo pipefail
          test -n "$FRONTEND_REPOSITORY" && test -n "$SPEC_REPOSITORY" || { echo '::error::Cross-repository source configuration required'; exit 1; }
          [[ "$FRONTEND_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]] && [[ "$SPEC_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]] || { echo '::error::Immutable cross-repository commit identities required'; exit 1; }

      - name: Checkout frontend candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.IPD_FRONTEND_REPOSITORY }}
          ref: ${{ vars.IPD_FRONTEND_COMMIT }}
          path: related-frontend
          token: ${{ secrets.IPD_CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout specification candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.IPD_SPEC_REPOSITORY }}
          ref: ${{ vars.IPD_SPEC_COMMIT }}
          path: related-spec
          token: ${{ secrets.IPD_CROSS_REPO_READ_TOKEN || github.token }}

      - name: Require nonempty cross-repository evidence
        run: |
          set -euo pipefail
          for required in "$FRONTEND_ROOT/src/api/ipd" "$FRONTEND_ROOT/src/views" "$FRONTEND_ROOT/src/locales" "$DOCS_ROOT"; do
            test -d "$required" && test -n "$(find "$required" -type f -print -quit)" || { echo '::error::Required source evidence missing or empty'; exit 1; }
          done

      - name: 检查门禁脚本实际存在
        run: |
          set -euo pipefail
          for script in scan-dead-code check-cross-repo-contract check-dynamic-loadable check-tenant-excludes-apply check-entity-complete check-duplicate-ssot check-doc-link check-i18n-unused-keys check-deletion-consistency check-shell-var-multibyte check-best-practices-coverage; do
            test -s "scripts/$script.sh" || { echo "::error::门禁脚本缺失: $script"; exit 1; }
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Setup jq + shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq shellcheck
          echo "jq: $(jq --version)"
          echo "shellcheck: $(shellcheck --version | head -1)"

      - name: Best-practice registry structure (not implementation acceptance)
        run: bash scripts/check-best-practices-coverage.sh

      # ---- 门禁 1：死代码扫描（RC-4） ----
      - name: 死代码扫描（scan-dead-code.sh）
        id: deadcode
        run: |
          set -euo pipefail
          bash scripts/scan-dead-code.sh

      # ---- 门禁 2：跨仓契约对账（RC-2） ----
      - name: 跨仓契约对账（check-cross-repo-contract.sh）
        id: contract
        run: |
          set -euo pipefail
          bash scripts/check-cross-repo-contract.sh

      # ---- 门禁 3：动态加载依赖清单（RC-5） ----
      - name: 动态加载清单（check-dynamic-loadable.sh）
        id: dynamic
        run: |
          set -euo pipefail
          bash scripts/check-dynamic-loadable.sh

      # ---- 门禁 4：配置先行 / DDL 落地对账（RC-3） ----
      - name: 租户白名单对账（check-tenant-excludes-apply.sh）
        id: tenant
        run: |
          set -euo pipefail
          bash scripts/check-tenant-excludes-apply.sh --skip-db

      - name: 实体完整性（check-entity-complete.sh）
        id: entity
        run: |
          set -euo pipefail
          bash scripts/check-entity-complete.sh

      # ---- 门禁 5：重复 SSOT 扫描（RC-6） ----
      - name: 重复 SSOT（check-duplicate-ssot.sh）
        id: dupssot
        run: |
          set -euo pipefail
          bash scripts/check-duplicate-ssot.sh

      # ---- 门禁 6：文档链接 / 端点路径校验（RC-7） ----
      - name: 文档链接（check-doc-link.sh）
        id: doclink
        run: |
          set -euo pipefail
          bash scripts/check-doc-link.sh

      # ---- 门禁 7：i18n 死键扫描（RC-8） ----
      - name: i18n 死键（check-i18n-unused-keys.sh）
        id: i18n
        run: |
          set -euo pipefail
          bash scripts/check-i18n-unused-keys.sh

      # ---- 门禁 8：删除前对账（RC-1） ----
      - name: 删除前对账（check-deletion-consistency.sh）
        id: deletion
        run: |
          set -euo pipefail
          bash scripts/check-deletion-consistency.sh --auto

      # ---- 门禁 9：shell 变量吞字节（R224，$VAR 紧跟非 ASCII） ----
      # 不同于上例的 WARN 惯例：本项硬阻断——违例必定是 bug 且修法是机械的
      # ${VAR}，没有"暂时容忍存量"的理由（存量已于 R224 一次性清零 16 文件 38 行）
      - name: shell 变量吞字节（check-shell-var-multibyte.sh）
        id: shellvar
        run: |
          set -euo pipefail
          bash scripts/check-shell-var-multibyte.sh --self-test
          bash scripts/check-shell-var-multibyte.sh

      - name: Static evidence scope
        if: always()
        run: |
          echo 'R25 checks cover static source only. DB verification is explicitly not executed (--skip-db); runtime/business acceptance remains pending.' >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: 总结
    runs-on: ubuntu-latest
    needs: lint-r25
    if: always()
    steps:
      - name: Enforce upstream result
        env:
          LINT_RESULT: ${{ needs.lint-r25.result }}
        run: |
          set -euo pipefail
          echo "R25 static checks: $LINT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$LINT_RESULT" = success || { echo '::error::Required static checks did not complete successfully'; exit 1; }
          echo 'Runtime, DB and business acceptance are pending and are not inferred from static checks.' >> "$GITHUB_STEP_SUMMARY"
