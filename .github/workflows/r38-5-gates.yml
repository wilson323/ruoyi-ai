name: r38-5-gates
# =============================================================================
# R39 治理轮 — 5 大门禁 GitHub Actions CI 接入
#
# 触发:
#   - pull_request 目标 main 时(主要场景,P4 实战验证可行)
#   - 手动 workflow_dispatch
#
# 5 大门禁:
#   1. doc ↔ db 漂移门禁(--refined 精炼模式)
#   2. 合同 ↔ spec ↔ code 三向对账
#   3. ipd 编译门禁(独立 workflow,沿用 R35+ ipd-compile-gate.yml)
#   4. ipd grant SQL 门禁(独立 workflow,沿用 R40+ ipd-grant-sql-gate.yml)
#   5. ipd 前端 drift 门禁(独立 workflow,沿用 R40+ ipd-frontend-drift.yml)
#
# 不重复造轮子 — R39 新增 1+2,3+4+5 调已存在 workflow。
#
# 退出策略:
#   - 门禁 1+2 失败 → 阻断 PR(本 workflow 内实跑,失败即红)
#   - 门禁 3+4+5 由各自独立 workflow 自行阻断
#
# 2026-10-03 假绿修复(3 处,全部经字节核实):
#   ① 门禁 1/2 原文用 `... || echo "::warning::..."` —— `||` 把退出码换成 0,
#      step 恒绿。文件头却写着「门禁 1+2 fail → 阻断 PR」,属**注释承诺阻断、
#      代码不阻断**。已改为保留原始退出码。
#   ② job 名 `r39-frontend-契约` 用中文「契约」,而 GitHub Actions 的 job id
#      只允许 [A-Za-z0-9_-]。该 job 实际从未成功运行过。已改为 `r39-contract-gate`。
#   ③ 门禁 3/4/5 用 `uses: ./.github/workflows/xxx.yml` 当作可复用 workflow 调用,
#      但那三个文件全是 `on: push/pull_request` 触发型,**没有 `workflow_call`**,
#      `uses:` 引用会直接失败。`with: java-version/maven-args/frontend-repo`
#      三个入参同样不存在。已改为文档说明 —— 3/4/5 各自独立运行,靠 GitHub
#      required-checks 汇总阻断,不在本 workflow 里伪聚合。
# =============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.claude/hooks/**'
      - 'pom.xml'
      - 'ruoyi-modules/**'
      - 'ruoyi-admin/**'
  workflow_dispatch:

# 防止重复触发 + 与已存在 ipd-drift-check.yml 并发跑
env:
  WORKFLOW_NAME: ${{ github.workflow }}
  REF_NAME: ${{ github.ref }}
concurrency:
  group: ${{ env.WORKFLOW_NAME }}-${{ env.REF_NAME }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 门禁 1+2:R39 新增 doc↔db + contract tri-source
  # ---------------------------------------------------------------------------
  r39-contract-gate:
    name: R39 doc↔db + contract tri-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: ipd_dev
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 mysql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client jq

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 13306 -uroot -ptest123 -e "SELECT 1" >/dev/null 2>&1; then
              echo "✅ MySQL up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: 写 mysql client config(凭据不入命令行)
        run: |
          mkdir -p .codex/ipd-dev/config
          cat > .codex/ipd-dev/config/mysql-client.cnf <<'EOF'
          [client]
          host=127.0.0.1
          port=13306
          user=root
          password=test123
          database=ipd_dev
          EOF

      - name: 准备 mock 真库表清单(单测场景,无需全 DDL)
        run: |
          mysql -h 127.0.0.1 -P 13306 -uroot -ptest123 -e "
            CREATE DATABASE IF NOT EXISTS ipd_dev;
            USE ipd_dev;
            -- mock 关键表用于哨兵通过
            CREATE TABLE IF NOT EXISTS audit_logs (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS products (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS persons (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS projects (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS tasks (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS ipd_requirements (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS gate_elements (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS handover_records (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS score_tasks (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS kpis (id BIGINT PRIMARY KEY);
            -- 30+ 张表满足 doc↔db 哨兵 db_table_count>=10
            CREATE TABLE IF NOT EXISTS ipd_dev_users (id BIGINT PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS test_run_records (id BIGINT PRIMARY KEY);
          "

      # 退出码语义(照 ownership-gate.yml 先例):
      #   0=通过  1=有违规(红)  2=门禁自身错误(红,不许当通过)
      # 关键: 判定与自证两步都跑。本项目已多次出现「检查在跑但没在检查」,
      #      只跑判定不跑自证,无法区分「真的干净」和「门禁自己坏了」。
      - name: 门禁 1/5 — doc ↔ db 漂移门禁(--refined)
        id: gate_drift
        run: |
          set +e
          bash scripts/check-doc-db-drift.sh --refined --json-only > /tmp/cdbd-refined.json 2>&1
          rc=$?
          set -e
          cat /tmp/cdbd-refined.json | head -20
          if [ "$rc" -ne 0 ]; then
            echo "::error::门禁 1/5 FAIL(exit=$rc),完整报告见 artifact r39-gate-evidence"
            exit "$rc"
          fi

      - name: 门禁 2/5 — 合同 ↔ spec ↔ code 三向对账
        id: gate_contract
        run: |
          set +e
          bash scripts/check-contract-tri-source.sh --json-only > /tmp/cts.json 2>&1
          rc=$?
          set -e
          cat /tmp/cts.json | head -20
          if [ "$rc" -ne 0 ]; then
            echo "::error::门禁 2/5 FAIL(exit=$rc),完整报告见 artifact r39-gate-evidence"
            exit "$rc"
          fi

      - name: 上传门禁产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r39-gate-evidence
          path: |
            /tmp/cdbd-refined.json
            /tmp/cts.json

  # ---------------------------------------------------------------------------
  # 门禁 3/4/5 不在本 workflow 内聚合(2026-10-03 修复)
  #
  # 原写法用 `uses: ./.github/workflows/xxx.yml` 把三个已有 workflow 当可复用
  # workflow 调用,但那三个文件全部是 `on: push/pull_request` 触发型,
  # **没有 `workflow_call`**,GitHub 会在调用时报 "not a reusable workflow" 直接失败。
  # `with:` 里的 java-version / maven-args / frontend-repo 三个入参也都不存在。
  # 即:这 3 个 job 从写下那天起就没运行成功过,却让文件头看起来「5 大门禁齐备」。
  #
  # 现状:这三个门禁各自作为独立 workflow 独立运行、独立阻断。
  #       若需要在 PR 上强制「五者全过」,正确做法是在仓库设置里把它们
  #       全部加入 branch protection 的 required status checks —— 那是
  #       GitHub 侧的聚合,不是 workflow YAML 能替代的。
  #
  # 门禁 3: .github/workflows/ipd-compile-gate.yml
  # 门禁 4: .github/workflows/ipd-grant-sql-gate.yml
  # 门禁 5: .github/workflows/ipd-frontend-drift.yml
  # ---------------------------------------------------------------------------
