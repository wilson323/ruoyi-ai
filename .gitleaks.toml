# RuoYi-AI 扩展 gitleaks 配置 — 补 justauth-client-secret 内联检测
# ====================================================================
# 动机:R41 兄弟 commit 6fe6d387 创建了 scripts/check-prod-secrets-inlined.sh
#       + workflow,在 CI 侧精准扫描 application-prod.yml justauth 段
#       client-secret 内联硬编码(实测 16 处违规,2 真硬编码 + 14 placeholder)。
#       但 gitleaks.yml workflow 走的是 gitleaks 默认规则(基于 entropy + 通用
#       正则),generic-api-key 是宽泛规则,可能漏 justauth 专属字段或被其他
#       规则抢先命中。本 .gitleaks.toml 加自定义规则 ruoyi-justauth-client-
#       secret-inlined,精准识别 application-prod*.yml 的 client-secret 字段
#       内联硬编码 + 占位符识别。
#
# 协同关系:
#   - gitleaks.yml workflow: 通用规则 + 本自定义规则(自动加载 .gitleaks.toml)
#   - check-prod-secrets-inlined.yml workflow: 精准规则(warning 模式,owner 决策)
#   - 两套门禁互补: gitleaks 通用 + justauth 专属;check-prod-secrets-inlined 严格
#
# 撞车风险评估(R25 软化条款 3 步):
#   1. 兄弟 R41 commit 6fe6d387 创建了 check-prod-secrets-inlined.{sh,yml}
#      → 本文件不动这 2 个文件,不动 gitleaks.yml ✅
#   2. 撞车主题: 兄弟做 justauth 精准脚本,本轮加 gitleaks 自定义规则
#      → 不同主题,互补不冲突 ✅
#   3. 强合入会破坏兄弟 R41 工作: 不会(本轮仅新增 .gitleaks.toml,不改任何文件) ✅
#
# 与既有 CI 的关系: 仅新增,不动 gitleaks.yml / check-prod-secrets-inlined.yml /
# check-prod-secrets-inlined.sh / ipd-drift-check.yml / r25-root-cause-lint.yml /
# r30-done-gate.yml / wiki-lint.yml.
#
# === 验证方法 ===
# 本地:
#   gitleaks detect --source ruoyi-admin/src/main/resources/application-prod.yml \
#     --config .gitleaks.toml --no-git --exit-code 1 -v
# 期望: 识别 line 210 (maxkey) + line 230 (gitee) 真硬编码,
#       放过 line 216/221/226/234... 占位符
# 实测 2026-09-18: 命中 3 处(generic-api-key 抢先 2 处 + line 32 token)
#
# 参考: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# 格式: gitleaks v8.25+ 支持的 toml 配置

title = "RuoYi-AI gitleaks extended config"

# 保留所有默认规则,扩展 justauth 专属规则
[extend]
useDefault = true

# 自定义规则: client-secret 内联硬编码(精准补 justauth 段)
# 注意:gitleaks 要求 keywords 在 line 邻近命中才执行 regex,
#       单 keyword "client-secret" 在 justauth 段每行都命中。
#       justauth 关键字因缩进 + 行距不会在 line 210 邻近命中,删掉。
[[rules]]
id = "ruoyi-justauth-client-secret-inlined"
description = "RuoYi-AI application-prod*.yml justauth 段 client-secret 内联硬编码"
regex = '''(?i)client-secret:\s*['"]*([A-Za-z0-9+/=_-]{16,})['"]*\s*$'''
entropy = 2.5
keywords = ["client-secret"]

  # allowlist: 放过占位符
  [[rules.allowlists]]
  description = "放过占位符(已脱敏的 /* **/ / xxxx 形式)与环境变量引用"
  regexTarget = "match"
  regexes = [
    '''[*x]{4,}''',         # 连续 * 或 x 占位符
    '''\$\{[A-Z_]+\}''',    # ${ENV_VAR} 占位符
    '''^\s*$''',            # 空值
    '''^\s*#''',            # 注释行
  ]

  # allowlist: 跳过非 yml 资源文件(避免误报)
  [[rules.allowlists]]
  description = "跳过非 yml 资源文件(避免误报)"
  paths = [
    '''(?i)\.(?:bmp|gif|jpe?g|png|svg|tiff?)$''',
    '''(?i)\.(?:eot|[ot]tf|woff2?)$''',
    '''(?i)\.(?:docx?|xlsx?|pdf|bin|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe|gltf)$''',
    '''(?:^|/)node_modules(?:/.*)?$''',
    '''(?:^|/)target(?:/.*)?$''',
    '''(?:^|/)\.git(?:/.*)?$''',
    '''(?:^|/)\.codex(?:/.*)?$''',
  ]